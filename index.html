<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    
    <!-- SEO Master Tags para Google Search Console -->
    <title>BIEN FOOD - Tienda Saludable & Orgánica VIP en Perú</title>
    <meta name="description" content="Compra superalimentos, frutos secos, harinas, tés y suplementos 100% orgánicos y naturales en Perú. Envíos a todo el país con Bien Food.">
    <meta name="keywords" content="bien food, bienfood, bienfood.pe, alimentos saludables peru, frutos secos, superalimentos, comida organica, suplementos naturales, trujillo">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://bienfood.pe/" />

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bienfood.pe/">
    <meta property="og:title" content="BIEN FOOD - Tienda Saludable & Orgánica VIP">
    <meta property="og:description" content="Superalimentos, frutos secos y productos orgánicos de máxima calidad. Realiza tu pedido en línea con envío a domicilio.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #f4f8f5; font-family: sans-serif; }
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
            transition: opacity 0.4s ease-out;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid #e2e8f0;
            border-top: 4px solid #16a34a; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { margin-top: 16px; color: #15803d; font-weight: 600; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Cargando BIEN FOOD...</div>
    </div>

    <!-- Aplicación Web vinculada directamente a la vista de cliente -->
    <iframe 
        id="mainApp" 
        src="https://script.google.com/macros/s/AKfycbx9m2x-w5tkvmDdwTJEuADdTdKLiDgNlYCqiC1vEZgYoarChfrJpIRWB-voLk5yWPSN/exec?view=client" 
        allow="geolocation; microphone; camera; payment"
        onload="hideLoader()">
    </iframe>

    <script>
        function hideLoader() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function() { loader.style.display = 'none'; }, 400);
            }
        }
    </script>
</body>
</html>
